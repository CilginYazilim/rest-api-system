<style>
:root{
    --cy-bg:#f6f8fb; --cy-surface:#ffffff; --cy-surface-soft:#f8fafc;
    --cy-text:#0f172a; --cy-text-soft:#475569; --cy-text-muted:#94a3b8;
    --cy-border:#e6ebf2; --cy-accent:#0ea5e9; --cy-brand-900:#061321;
}
@media (prefers-color-scheme: dark){
    :root{
        --cy-bg:#0b1220; --cy-surface:#131c2e; --cy-surface-soft:#182437;
        --cy-text:#e8edf5; --cy-text-soft:#b3c0d4; --cy-text-muted:#7d8ca6;
        --cy-border:#223149;
    }
}
*{box-sizing:border-box}
body{
    margin:0; padding:2.5rem 1.25rem 4rem;
    background:var(--cy-bg); color:var(--cy-text);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.wrap{max-width:1080px;margin:0 auto}
header{text-align:center;margin-bottom:2.5rem}
h1{font-size:1.6rem;margin:0 0 .4rem}
.lead{color:var(--cy-text-soft);margin:0 0 1.25rem}
.nav a{
    display:inline-block;margin:.25rem .3rem;padding:.5rem .95rem;
    border:1px solid var(--cy-border);border-radius:8px;
    background:var(--cy-surface);color:var(--cy-text);
    text-decoration:none;font-size:.9rem;
}
.nav a:hover{border-color:var(--cy-accent);color:var(--cy-accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem}
figure{
    margin:0;background:var(--cy-surface);
    border:1px solid var(--cy-border);border-radius:12px;overflow:hidden;
}
figure img{display:block;width:100%;height:auto;background:var(--cy-surface-soft)}
figcaption{
    padding:.7rem .9rem;font-size:.87rem;color:var(--cy-text-soft);
    border-top:1px solid var(--cy-border);
}
footer{
    margin-top:3rem;text-align:center;
    font-size:.85rem;color:var(--cy-text-muted);
}
footer a{color:var(--cy-text-soft)}
</style>
</head>
<body>
<div class="wrap">

    <nav class="nav">

    </nav>
</header>

    <figure><img src="screenshots/03-api-jetonlari.png" alt="API jetonları" loading="lazy"><figcaption>API jetonları — üretim ve kapsam seçimi</figcaption></figure>
    <figure><img src="screenshots/04-api-belgeleri.png" alt="API belgeleri" loading="lazy"><figcaption>API belgeleri</figcaption></figure>
    <figure><img src="screenshots/05-koyu-tema.png" alt="Koyu tema" loading="lazy"><figcaption>Koyu tema</figcaption></figure>
